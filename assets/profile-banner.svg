<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;700;900&amp;display=swap');
      text { font-family: 'Arial', 'Helvetica', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="#0a0a0a"/>

  <!-- Grid lines — Bauhaus structural element -->
  <line x1="0" y1="80" x2="900" y2="80" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="0" y1="200" x2="900" y2="200" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="280" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="280" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Accent bar — Swiss red -->
  <rect x="0" y="0" width="6" height="280" fill="#E63946"/>

  <!-- Primary name — massive Swiss typography -->
  <text x="36" y="68" font-size="62" font-weight="900" fill="#ffffff" letter-spacing="-2">DRESDEN GOEHNER</text>

  <!-- Descriptor line -->
  <text x="36" y="104" font-size="14" font-weight="300" fill="#666666" letter-spacing="4">APPLIED MATHEMATICS  ·  TRUSTWORTHY ML  ·  SCIENTIFIC OSS</text>

  <!-- Three stat blocks — Bauhaus grid -->
  <!-- Block 1 -->
  <rect x="36" y="130" width="240" height="80" fill="#111111"/>
  <text x="56" y="165" font-size="36" font-weight="900" fill="#ffffff">23</text>
  <text x="56" y="185" font-size="11" fill="#888888" letter-spacing="2">EXTERNAL MERGED PRs</text>
  <text x="56" y="200" font-size="10" fill="#444444">14 organizations · 15 repos</text>

  <!-- Block 2 -->
  <rect x="296" y="130" width="240" height="80" fill="#111111"/>
  <text x="316" y="165" font-size="36" font-weight="900" fill="#ffffff">215K+</text>
  <text x="316" y="185" font-size="11" fill="#888888" letter-spacing="2">RECIPIENT REPO STARS</text>
  <text x="316" y="200" font-size="10" fill="#444444">dify · PEFT · NetworkX · fairlearn</text>

  <!-- Block 3 -->
  <rect x="556" y="130" width="240" height="80" fill="#111111"/>
  <text x="576" y="165" font-size="36" font-weight="900" fill="#ffffff">AIME</text>
  <text x="576" y="185" font-size="11" fill="#888888" letter-spacing="2">14/15 · BMO R2 · SMT 3RD</text>
  <text x="576" y="200" font-size="10" fill="#444444">BPhO Top Gold · UKMT · WSC Champion</text>

  <!-- Bottom strip -->
  <rect x="0" y="240" width="900" height="40" fill="#111111"/>
  <text x="36" y="264" font-size="11" fill="#555555" letter-spacing="3">ENERGY INNOVATION INTERN  ·  BEIJING ROYAL SCHOOL  ·  CLASS OF 2027</text>
  <text x="800" y="264" font-size="11" fill="#E63946" letter-spacing="1">dresdengoehner.com</text>
</svg>
