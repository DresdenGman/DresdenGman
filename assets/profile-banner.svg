<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Dresden Goehner — trustworthy computational tools</title>
  <desc id="desc">A visual pipeline connecting data, models, evidence, and decisions, with uncertainty, provenance, and failure gates.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#0d1b2f"/>
      <stop offset="1" stop-color="#10263a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93c5fd" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <path d="M0 256C180 218 312 282 510 245S862 184 1200 231" fill="none" stroke="#5eead4" stroke-opacity="0.08" stroke-width="2"/>
  <path d="M0 278C186 242 338 306 525 266S876 207 1200 248" fill="none" stroke="#60a5fa" stroke-opacity="0.09" stroke-width="2"/>

  <g transform="translate(64 66)">
    <text fill="#e5f2ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="700" letter-spacing="1.2">DRESDEN GOEHNER</text>
    <rect y="57" width="430" height="4" rx="2" fill="url(#accent)"/>
    <text y="102" fill="#b8cee3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Building trustworthy computational tools</text>
    <text y="132" fill="#b8cee3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">for real-world decisions.</text>

    <g transform="translate(0 174)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600">
      <rect width="150" height="36" rx="18" fill="#5eead4" fill-opacity="0.1" stroke="#5eead4" stroke-opacity="0.45"/>
      <text x="75" y="23" fill="#8ff3e3" text-anchor="middle">RELIABLE ML</text>
      <rect x="164" width="174" height="36" rx="18" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-opacity="0.45"/>
      <text x="251" y="23" fill="#93c5fd" text-anchor="middle">SCIENTIFIC OSS</text>
      <rect x="352" width="210" height="36" rx="18" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.45"/>
      <text x="457" y="23" fill="#c4b5fd" text-anchor="middle">PROBABILISTIC SYSTEMS</text>
    </g>
  </g>

  <g transform="translate(640 67)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <path d="M60 74H156M212 74H308M364 74H460" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M186 105V164M338 105V164" fill="none" stroke="#7dd3fc" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="5 6"/>

    <g filter="url(#glow)"><circle cx="34" cy="74" r="7" fill="#5eead4"/></g>
    <circle cx="60" cy="74" r="31" fill="#10283a" stroke="#5eead4" stroke-width="2"/>
    <circle cx="186" cy="74" r="31" fill="#11283d" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="338" cy="74" r="31" fill="#15263e" stroke="#818cf8" stroke-width="2"/>
    <circle cx="486" cy="74" r="31" fill="#1a2440" stroke="#a78bfa" stroke-width="2"/>

    <text x="60" y="80" fill="#dffbf6" font-size="14" font-weight="700" text-anchor="middle">DATA</text>
    <text x="186" y="80" fill="#e0efff" font-size="14" font-weight="700" text-anchor="middle">MODEL</text>
    <text x="338" y="80" fill="#e5e7ff" font-size="14" font-weight="700" text-anchor="middle">EVIDENCE</text>
    <text x="486" y="80" fill="#f0eaff" font-size="14" font-weight="700" text-anchor="middle">DECISION</text>

    <rect x="119" y="164" width="134" height="42" rx="10" fill="#0b1c2e" stroke="#60a5fa" stroke-opacity="0.55"/>
    <text x="186" y="181" fill="#93c5fd" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.8">UNCERTAINTY</text>
    <text x="186" y="196" fill="#7f9bb5" font-size="10" text-anchor="middle">calibration · shift</text>

    <rect x="271" y="164" width="134" height="42" rx="10" fill="#0b1c2e" stroke="#818cf8" stroke-opacity="0.55"/>
    <text x="338" y="181" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.8">PROVENANCE</text>
    <text x="338" y="196" fill="#7f9bb5" font-size="10" text-anchor="middle">source · assumptions</text>

    <rect x="423" y="164" width="126" height="42" rx="10" fill="#0b1c2e" stroke="#a78bfa" stroke-opacity="0.55"/>
    <text x="486" y="181" fill="#c4b5fd" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.8">FAILURE GATES</text>
    <text x="486" y="196" fill="#7f9bb5" font-size="10" text-anchor="middle">test · reject · learn</text>
  </g>
</svg>
