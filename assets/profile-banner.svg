<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Dresden — trustworthy computational tools</title>
  <desc id="desc">A visual pipeline connecting data, models, evidence, and decisions, with uncertainty, provenance, and failure gates.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#0d1b2f"/>
      <stop offset="1" stop-color="#10263a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93c5fd" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <path d="M0 256C180 218 312 282 510 245S862 184 1200 231" fill="none" stroke="#5eead4" stroke-opacity="0.08" stroke-width="2"/>
  <path d="M0 278C186 242 338 306 525 266S876 207 1200 248" fill="none" stroke="#60a5fa" stroke-opacity="0.09" stroke-width="2"/>

  <g transform="translate(64 66)">
    <text fill="#e5f2ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="700" letter-spacing="1.2">DRESDEN</text>
    <rect y="57" width="430" height="4" rx="2" fill="url(#accent)"/>
    <text y="102" fill="#b8cee3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Building trustworthy computational tools</text>
    <text y="132" fill="#b8cee3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">for real-world decisions.</text>

    <g transform="translate(0 174)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600">
      <rect width="150" height="36" rx="18" fill="#5eead4" fill-opacity="0.1" stroke="#5eead4" stroke-opacity="0.45"/>
      <text x="75" y="23" fill="#8ff3e3" text-anchor="middle">RELIABLE ML</text>
      <rect x="164" width="174" height="36" rx="18" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-opacity="0.45"/>
      <text x="251" y="23" fill="#93c5fd" text-anchor="middle">SCIENTIFIC OSS</text>
      <rect x="352" width="210" height="36" rx="18" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.45"/>
      <text x="457" y="23" fill="#c4b5fd" text-anchor="middle">PROBABILISTIC SYSTEMS</text>
    </g>
  </g>

  <g transform="translate(640 53)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="13" fill="#7f9bb5" font-size="10" font-weight="700" letter-spacing="1.8">A RELIABILITY PIPELINE</text>

    <path d="M112 61H126M238 61H252M364 61H378" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M56 99V116M182 99V116M308 99V116M434 99V116" fill="none" stroke="#7dd3fc" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 5"/>

    <g filter="url(#glow)"><circle cx="8" cy="61" r="6" fill="#5eead4"/></g>
    <rect x="0" y="22" width="112" height="78" rx="16" fill="#10283a" stroke="#5eead4" stroke-width="2"/>
    <rect x="126" y="22" width="112" height="78" rx="16" fill="#11283d" stroke="#60a5fa" stroke-width="2"/>
    <rect x="252" y="22" width="112" height="78" rx="16" fill="#15263e" stroke="#818cf8" stroke-width="2"/>
    <rect x="378" y="22" width="112" height="78" rx="16" fill="#1a2440" stroke="#a78bfa" stroke-width="2"/>

    <text x="16" y="43" fill="#8ff3e3" font-size="10" font-weight="700" letter-spacing="1.2">01</text>
    <text x="142" y="43" fill="#93c5fd" font-size="10" font-weight="700" letter-spacing="1.2">02</text>
    <text x="268" y="43" fill="#a5b4fc" font-size="10" font-weight="700" letter-spacing="1.2">03</text>
    <text x="394" y="43" fill="#c4b5fd" font-size="10" font-weight="700" letter-spacing="1.2">04</text>
    <text x="56" y="73" fill="#dffbf6" font-size="15" font-weight="700" text-anchor="middle">DATA</text>
    <text x="182" y="73" fill="#e0efff" font-size="15" font-weight="700" text-anchor="middle">MODEL</text>
    <text x="308" y="73" fill="#e5e7ff" font-size="14" font-weight="700" text-anchor="middle">EVIDENCE</text>
    <text x="434" y="73" fill="#f0eaff" font-size="14" font-weight="700" text-anchor="middle">DECISION</text>
    <text x="56" y="89" fill="#7f9bb5" font-size="10" text-anchor="middle">inputs · context</text>
    <text x="182" y="89" fill="#7f9bb5" font-size="10" text-anchor="middle">fit · assumptions</text>
    <text x="308" y="89" fill="#7f9bb5" font-size="10" text-anchor="middle">test · review</text>
    <text x="434" y="89" fill="#7f9bb5" font-size="10" text-anchor="middle">act · reject</text>

    <rect x="0" y="116" width="154" height="42" rx="11" fill="#0b1c2e" stroke="#60a5fa" stroke-opacity="0.55"/>
    <rect x="168" y="116" width="154" height="42" rx="11" fill="#0b1c2e" stroke="#818cf8" stroke-opacity="0.55"/>
    <rect x="336" y="116" width="154" height="42" rx="11" fill="#0b1c2e" stroke="#a78bfa" stroke-opacity="0.55"/>
    <text x="77" y="133" fill="#93c5fd" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.8">UNCERTAINTY</text>
    <text x="77" y="148" fill="#7f9bb5" font-size="10" text-anchor="middle">calibration · shift</text>
    <text x="245" y="133" fill="#a5b4fc" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.8">PROVENANCE</text>
    <text x="245" y="148" fill="#7f9bb5" font-size="10" text-anchor="middle">source · assumptions</text>
    <text x="413" y="133" fill="#c4b5fd" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.6">FAILURE GATES</text>
    <text x="413" y="148" fill="#7f9bb5" font-size="10" text-anchor="middle">test · reject · learn</text>
  </g>
</svg>
